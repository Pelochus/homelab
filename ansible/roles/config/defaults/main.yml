---
config_bashrc_path: /home/{{ user }}/.bashrc

# OS tooling
config_syspkgs:
  - eza
  - build-essential
  - net-tools
  - unattended-upgrades
  - traceroute
  - wget
  - curl
  - nano
  - neovim
  - htop
  - btop
  - lm-sensors
  - iperf3
  - speedtest-cli
  - fastfetch
  - bleachbit

config_refresh_unit: homelab-refresh

config_refresh_cadence: "*-*-01 04:00"
