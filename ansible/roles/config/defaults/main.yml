---
config_bashrc_path: /home/{{ user }}/.bashrc

# OS tooling
config_syspkgs:
  - build-essential
  - unattended-upgrades
  - traceroute
  - wget
  - curl
  - nano
  - neovim
  - htop
  - btop
  - lm-sensors
  - smartmontools
  - watchdog
  - iperf3
  - fastfetch
  - intel-opencl-icd
  - bleachbit

  - jq
  - lsof
  - sysstat
  - iotop
  - dnsutils
  - tmux
  - zip
  - unzip

  # switchable: uncomment when a node needs them
  # - tcpdump
  # - netcat-openbsd
  # - cifs-utils
  # - hdparm
  # - pigz

  # modern coreutils replacements
  - eza
  - bat
  - ripgrep
  - fd-find
  - zoxide
  - duf
  - ncdu
  - pv
  - fzf
  - du-dust

config_timezone: Europe/Madrid

config_refresh_unit: homelab-refresh

config_refresh_cadence: "*-*-01 04:00"

config_watchdog_unit: watchdog.service
config_watchdog_device: /dev/watchdog0
config_watchdog_timeout: 30
config_watchdog_interval: 10
config_watchdog_priority: 1
config_watchdog_realtime: true
config_watchdog_module: none
