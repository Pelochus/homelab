---
config_bashrc_path: /home/{{ user }}/.bashrc

# OS tooling
config_syspkgs:
  - build-essential
  - unattended-upgrades
  - traceroute
  - wget
  - curl
  - nano
  - neovim
  - htop
  - btop
  - lm-sensors
  - iperf3
  - fastfetch
  - bleachbit

  # modern coreutils replacements
  - eza
  - bat
  - ripgrep
  - fd-find
  - zoxide
  - duf
  - ncdu
  - pv
  - fzf
  - du-dust

config_refresh_unit: homelab-refresh

config_refresh_cadence: "*-*-01 04:00"
