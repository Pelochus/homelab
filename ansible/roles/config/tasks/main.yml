---
- name: Add the shell block to .bashrc
  vars:
    aliases_file: "{{ role_path }}/files/bashrc-block.txt"
  ansible.builtin.blockinfile:
    path: "{{ config_bashrc_path }}"
    marker: "# {mark} Ansible managed aliases block"
    block: "{{ lookup('ansible.builtin.file', aliases_file) }}"

- name: Install OS-related dependencies
  ansible.builtin.apt:
    pkg: "{{ config_syspkgs }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time_installs }}"
  become: true

- name: Configure unattended package upgrades
  ansible.builtin.copy:
    src: 20unattended
    dest: /etc/apt/apt.conf.d/20unattended
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Configure the hardware watchdog
  ansible.builtin.import_tasks: watchdog.yml
  when: config_watchdog_device | length > 0

- name: Apply the systemd refresh schedule
  ansible.builtin.import_tasks: scheduler.yml
