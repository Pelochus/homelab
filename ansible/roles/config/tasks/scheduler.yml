---
- name: Create the refresh log dir
  ansible.builtin.file:
    path: "{{ homelab_root }}/logs"
    state: directory
    mode: "0755"
  become: true

- name: Install the refresh service unit
  ansible.builtin.template:
    src: "{{ config_refresh_unit }}.service.j2"
    dest: "/etc/systemd/system/{{ config_refresh_unit }}.service"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install the refresh timer unit
  ansible.builtin.template:
    src: "{{ config_refresh_unit }}.timer.j2"
    dest: "/etc/systemd/system/{{ config_refresh_unit }}.timer"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Activate the refresh timer
  ansible.builtin.systemd_service:
    name: "{{ config_refresh_unit }}.timer"
    state: started
    enabled: true
    daemon_reload: true
  become: true
