---
- name: Create Docker Network
  community.docker.docker_network:
    name: "{{ deploy_docker_network }}"
    driver: bridge
    ipam_config:
      - subnet: "{{ deploy_docker_subnet }}"
        gateway: "{{ deploy_docker_gateway }}"
  become: true

- name: Add the user to the Docker group
  ansible.builtin.user:
    name: "{{ user }}"
    groups: [docker]
    append: true
  become: true

- name: Enable the Docker service
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  become: true

# first deploy only; refresh.yml owns image updates
- name: Deploy Docker containers
  community.docker.docker_compose_v2:
    project_src: "{{ homelab_root }}/docker/{{ item }}"
    pull: missing
    state: present
  loop: "{{ compose_stacks }}"
