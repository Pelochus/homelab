---
# docker itself is installed per-OS, never by this repo (docker.io on Ubuntu, docker on Arch)
- name: Notice that Docker has to be installed per-OS
  ansible.builtin.shell:
    cmd: |
      command -v docker || {
          echo "Docker is not installed; this repo does not install it." >&2
          echo "Install it per-OS first: docker.io on Ubuntu, docker on Arch." >&2
          exit 1
      }
  changed_when: false

- name: Create Docker Network
  community.docker.docker_network:
    name: "{{ deploy_docker_network }}"
    driver: bridge
    ipam_config:
      - subnet: "{{ deploy_docker_subnet }}"
        gateway: "{{ deploy_docker_gateway }}"
  become: true

- name: Add the user to the Docker group
  ansible.builtin.user:
    name: "{{ user }}"
    groups: [docker]
    append: true
  become: true

- name: Enable the Docker service
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  become: true

# docker creates the bind dirs root-owned, so the services cannot write into them
- name: Own the compose state dirs of each stack
  ansible.builtin.command:
    cmd: chown -R {{ user }}:{{ user }} {{ homelab_root }}/docker/{{ item }}
  loop: "{{ compose_stacks }}"
  become: true
  changed_when: false

# first deploy only; docker-refresh.yml owns image updates
- name: Deploy Docker containers
  community.docker.docker_compose_v2:
    project_src: "{{ homelab_root }}/docker/{{ item }}"
    pull: missing
    state: present
  loop: "{{ compose_stacks }}"
