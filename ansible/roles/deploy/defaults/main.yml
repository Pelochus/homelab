---
# homelab software (OS tooling lives in the config role)
deploy_packages:
  - git
  - sudo
  - rsync
  - uptimed
  - python3-full
  - python-is-python3
  - python3-pip
  - gnupg
  - ksmbd-tools
  # - samba
  # - samba-common-bin
  # - docker.io # Better use the official docker install guide

deploy_samba_conf: /etc/ksmbd/ksmbd.conf
deploy_samba_user: "{{ user }}"
deploy_samba_name: BolloNAS
deploy_samba_share: /media/hdd/BolloNAS
deploy_samba_template: ksmbd.conf.j2

# the external network every compose stack declares
deploy_docker_network: homelab
deploy_docker_subnet: 10.0.1.0/24
deploy_docker_gateway: 10.0.1.1
