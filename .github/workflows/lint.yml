---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      # requirements_file installs community.docker so the role FQCNs resolve
      - name: ansible-lint
        uses: ansible/ansible-lint@main
        with:
          args: ansible
          requirements_file: ansible/requirements.yml

  yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install yamllint
        run: python3 -m pip install --quiet --upgrade yamllint
      # reads .yamllint from the repo root, the rules ansible-lint also applies
      - name: yamllint
        run: yamllint .
      # yamlfmt release tag and asset name must match
      - name: yamlfmt
        run: |
          asset=https://github.com/google/yamlfmt/releases/download/v0.21.0
          wget -q "$asset/yamlfmt_0.21.0_Linux_x86_64.tar.gz"
          tar xzf yamlfmt_0.21.0_Linux_x86_64.tar.gz
          chmod +x yamlfmt
          ./yamlfmt -lint
      # compose files are not Ansible YAML
      - name: docker compose
        run: |-
          for compose in docker/*/docker-compose.yml; do
            docker compose -f "$compose" config > /dev/null
          done
