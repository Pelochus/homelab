---

services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${HOMELAB_TZ}
      - HASHED_PASSWORD=${CODE_SERVER_HASHED_PASSWORD:?argon2 hash required, see README}
      - PROXY_DOMAIN=${CODE_SERVER_HOST}
      - DEFAULT_WORKSPACE=${CODE_SERVER_WORKSPACE}
    volumes:
      - ./code-server/config:/config
      - ${CODE_SERVER_HOME}:/home
    # ports:
    # - 8443:8443
    healthcheck:
      test: ['CMD', 'curl', '-sfL', 'http://127.0.0.1:8443/']
      interval: 120s
      start_period: 30s
      timeout: 5s
    restart: unless-stopped
    networks:
      homelab:
        ipv4_address: 10.0.1.90

  pyload-ng:
    image: lscr.io/linuxserver/pyload-ng:latest
    container_name: pyload-ng
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${HOMELAB_TZ}
    volumes:
      - ./pyload-ng/config:/config
      - ${PYLOAD_DIR}:/downloads
    # ports:
    #   - 8000:8000 # WebUI port
    healthcheck:
      test: ['CMD', 'curl', '-sfL', 'http://127.0.0.1:8000/']
      interval: 120s
      start_period: 30s
      timeout: 5s
    restart: unless-stopped
    networks:
      homelab:
        ipv4_address: 10.0.1.91

networks:
  homelab:
    external: true
