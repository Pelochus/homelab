---
# Homarr, Beszel (hub + agent)
services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    init: true
    restart: unless-stopped
    environment:
      - HOMELAB_TZ=${HOMELAB_TZ:-Europe/Madrid}
      - SECRET_ENCRYPTION_KEY=9fb0446198ef137e6dcb75568f0c9f7266fdd52b9d7a07875767e55beb29d77c
    volumes:
      - ./homarr/appdata:/appdata
      - /var/run/docker.sock:/var/run/docker.sock
    # ports:
    #   - '7575:7575'
    networks:
      homelab:
        ipv4_address: 10.0.1.20

  beszel:
    container_name: beszel
    image: henrygd/beszel:latest
    init: true
    restart: unless-stopped
    # healthcheck:
    #   test: ['CMD', '/beszel', 'health', '--url', 'http://10.0.1.21:8090']
    #   interval: 120s
    #   start_period: 10s
    #   timeout: 5s
    environment:
      - APP_URL=${BESZEL_URL:-http://10.0.1.21:8090}
    volumes:
      - ./beszel/data:/beszel_data
      - ./beszel/socket:/beszel_socket
    networks:
      homelab:
        ipv4_address: 10.0.1.21

  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:latest
    restart: unless-stopped
    # healthcheck:
    #   test: ['CMD', '/agent', 'health']
    #   interval: 120s
    network_mode: host
    volumes:
      - ./beszel/agent:/var/lib/beszel-agent
      - ./beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: ${BESZEL_URL:-http://10.0.1.21:8090}
      TOKEN: ${BESZEL_TOKEN:-}
      KEY: "${BESZEL_KEY:-}"
      # healthcheck:
      #   test: ['CMD', '/agent', 'health']
      #   interval: 120s

networks:
  homelab:
    external: true
