---
services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    init: true
    restart: unless-stopped
    # secrets stay out of git: the gitignored .secrets.env is absent in CI, present on the node
    env_file:
      - path: ./.secrets.env
        required: false
    environment:
      - TZ=${HOMELAB_TZ}
    volumes:
      - ./homarr/appdata:/appdata
      - /var/run/docker.sock:/var/run/docker.sock
    # ports:
    #   - '7575:7575'
    networks:
      homelab:
        ipv4_address: 10.0.1.20

  beszel:
    container_name: beszel
    image: henrygd/beszel:latest
    init: true
    restart: unless-stopped
    # the hub's own health endpoint, probed through its APP_URL port
    healthcheck:
      test: ['CMD', '/beszel', 'health', '--url', 'http://127.0.0.1:8090']
      interval: 120s
      start_period: 10s
      timeout: 5s
    environment:
      - TZ=${HOMELAB_TZ}
      - APP_URL=${BESZEL_URL}
    volumes:
      - ./beszel/data:/beszel_data
      - ./beszel/socket:/beszel_socket
    networks:
      homelab:
        ipv4_address: 10.0.1.21

  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:latest
    init: true
    restart: unless-stopped
    healthcheck:
      test: ['CMD', '/agent', 'health']
      interval: 120s
      timeout: 5s
    # TOKEN and KEY come from the gitignored .secrets.env
    env_file:
      - path: ./.secrets.env
        required: false
    network_mode: host
    volumes:
      - ./beszel/agent:/var/lib/beszel-agent
      - ./beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: ${BESZEL_URL}

networks:
  homelab:
    external: true
