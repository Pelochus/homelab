---

services:
  web:
    container_name: web
    image: nginx:latest
    init: true
    # Ports stay closed: the site is reachable only through the reverse proxy.
    # ports:
    #   - "8888:80"
    volumes:
      - ./web/site:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      homelab:
        ipv4_address: 10.0.1.100

networks:
  homelab:
    external: true
