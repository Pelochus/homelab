---

services:
  web:
    container_name: web
    image: nginx:latest
    init: true
    # ports:
    #   - "8888:80"
    volumes:
      - ./web/site:/usr/share/nginx/html:ro
    # the nginx image ships no HTTP client, so its config test is the health probe
    healthcheck:
      test: ['CMD', '/usr/sbin/nginx', '-t', '-vv']
      interval: 120s
      timeout: 5s
    restart: unless-stopped
    networks:
      homelab:
        ipv4_address: 10.0.1.100

networks:
  homelab:
    external: true
