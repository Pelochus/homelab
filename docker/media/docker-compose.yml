---
# This Docker compose file includes:
#   qBittorrent-nox (no GUI, but with webUI)
#   *Arr (Sonarr, Radarr, Prowlarr)
#   Jellyfin

# Use docker logs qbittorrent-nox for seeing temporal password on first run
services:
  qbittorrent-nox:
    container_name: qbittorrent-nox
    image: qbittorrentofficial/qbittorrent-nox:latest
    init: true
    environment:
      # - PAGID=10000
      # - PGID=1000
      # - PUID=1000
      - QBT_EULA=accept
      - QBT_VERSION=latest
      - QBT_WEBUI_PORT=8080
      - HOMELAB_TZ=${HOMELAB_TZ:-Europe/Madrid}
      # - UMASK=022
    ports:
      # for bittorrent traffic
      - 6881:6881/tcp
      - 6881:6881/udp
      # for WebUI
      # - 8080:8080/tcp
    read_only: true
    restart: 'unless-stopped'
    stop_grace_period: 30m
    tmpfs:
      - /tmp
    tty: true
    volumes:
      - ./qbittorrent/config:/config
      - ${TORRENT_DIR:-/media/hdd/BolloNAS/Torrents}:/downloads
      - ${MEDIA_ROOT:-/media}:/media
    networks:
      homelab:
        ipv4_address: 10.0.1.30

  ####################################################
  # Arr configuration is extracted from hotio's images
  ####################################################

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest
    init: true
    # ports:
    # - "9696:9696"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=002
      - HOMELAB_TZ=${HOMELAB_TZ:-Europe/Madrid}
    volumes:
      - ./prowlarr/config:/config
    restart: 'unless-stopped'
    networks:
      homelab:
        ipv4_address: 10.0.1.31

  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    init: true
    # ports:
    #   - "7878:7878"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=002
      - HOMELAB_TZ=${HOMELAB_TZ:-Europe/Madrid}
    volumes:
      - ./radarr/config:/config
      - ./radarr/data:/data
      - ${MEDIA_ROOT:-/media}:/media
    restart: 'unless-stopped'
    depends_on:
      - qbittorrent-nox
    networks:
      homelab:
        ipv4_address: 10.0.1.32

  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:latest
    init: true
    # ports:
    #   - "8989:8989"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=002
      - HOMELAB_TZ=${HOMELAB_TZ:-Europe/Madrid}
    volumes:
      - ./sonarr/config:/config
      - ./sonarr/data:/data
      - ${MEDIA_ROOT:-/media}:/media
    restart: 'unless-stopped'
    depends_on:
      - qbittorrent-nox
    networks:
      homelab:
        ipv4_address: 10.0.1.33

  ####################################################
  # End of Arr configuration
  ####################################################

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    init: true
    user: ${JELLYFIN_UID:-1000}:${JELLYFIN_GID:-1000} # Remember to change using id -u : id -g
    # network_mode: 'host' # Required for DLNA, incompatible with network settings below
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - type: bind
        source: ${JELLYFIN_DIR:-/media/hdd/BolloNAS/Jellyfin}
        target: /media
        # - /path/to/media2:/media2:ro
    restart: 'unless-stopped'
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices: # Allow Intel/AMD HW acceleration
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    group_add:
      - ${RENDER_GID:-993} # Search for render group id with: cat /etc/group | grep render
    networks:
      homelab:
        ipv4_address: 10.0.1.34

networks:
  homelab:
    external: true
