---
# first run logs a temporary webUI password
services:
  qbittorrent-nox:
    container_name: qbittorrent-nox
    image: qbittorrentofficial/qbittorrent-nox:latest
    init: true
    environment:
      # - PAGID=10000
      # - PGID=1000
      # - PUID=1000
      - QBT_EULA=accept
      - QBT_VERSION=latest
      - QBT_WEBUI_PORT=8080
      - TZ=${HOMELAB_TZ}
      # - UMASK=022
    ports:
      - 6881:6881/tcp
      - 6881:6881/udp
      # - 8080:8080/tcp
    read_only: true
    restart: 'unless-stopped'
    stop_grace_period: 30m
    tmpfs:
      - /tmp
    tty: true
    volumes:
      - ./qbittorrent/config:/config
      - ${TORRENT_DIR}:/downloads
      - ${MEDIA_ROOT}:/media
    networks:
      homelab:
        ipv4_address: 10.0.1.30

  ####################################################
  # Arr configuration
  ####################################################

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest
    # ports:
    # - "9696:9696"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${HOMELAB_TZ}
    volumes:
      - ./prowlarr/config:/config
    restart: 'unless-stopped'
    networks:
      homelab:
        ipv4_address: 10.0.1.31

  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    # ports:
    #   - "7878:7878"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${HOMELAB_TZ}
    volumes:
      - ./radarr/config:/config
      - ./radarr/data:/data
      - ${MEDIA_ROOT}:/media
    restart: 'unless-stopped'
    depends_on:
      - qbittorrent-nox
    networks:
      homelab:
        ipv4_address: 10.0.1.32

  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:latest
    # ports:
    #   - "8989:8989"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${HOMELAB_TZ}
    volumes:
      - ./sonarr/config:/config
      - ./sonarr/data:/data
      - ${MEDIA_ROOT}:/media
    restart: 'unless-stopped'
    depends_on:
      - qbittorrent-nox
    networks:
      homelab:
        ipv4_address: 10.0.1.33

  ####################################################
  # End of Arr configuration
  ####################################################

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    init: true
    user: ${JELLYFIN_UID}:${JELLYFIN_GID}
    # network_mode: host # DLNA only; conflicts with the networks block below
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - type: bind
        source: ${JELLYFIN_DIR}
        target: /media
        # - /path/to/media2:/media2:ro
    restart: 'unless-stopped'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    group_add:
      - ${RENDER_GID}
    networks:
      homelab:
        ipv4_address: 10.0.1.34

networks:
  homelab:
    external: true
