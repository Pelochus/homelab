---

services:
  nginx-proxy:
    container_name: nginx-proxy
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    environment:
      - TZ=${HOMELAB_TZ}
    ports:
      - '80:80'
      # - '81:81' # WebUI port
      - '443:443'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:81/']
      interval: 120s
      timeout: 5s
    volumes:
      # routing state lives here, not in this file
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
    networks:
      homelab:
        ipv4_address: 10.0.1.10

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguard
    init: true
    restart: unless-stopped
    environment:
      - TZ=${HOMELAB_TZ}
    # network_mode: host
    ports:
      - 53:53/tcp
      - 53:53/udp
      # - 88:80/tcp # http web interface
      # - 3000:3000/tcp # initial setup web interface
    # the web interface port stays unmapped, so the binary itself answers for health
    healthcheck:
      test: ['CMD', '/opt/adguardhome/AdGuardHome', '--version']
      interval: 120s
      timeout: 5s
    volumes:
      - ./adguard/config:/opt/adguardhome/conf
      - ./adguard/work:/opt/adguardhome/work
    networks:
      homelab:
        ipv4_address: ${ADGUARD_IPV4}

  wg-easy:
    environment:
      - LANG=en
      - TZ=${HOMELAB_TZ}
      - WG_HOST=${WG_HOST:?wg-easy needs a public host name to hand out}
      # - PASSWORD=foobar123
      # - WG_PORT=51820
      # - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=${ADGUARD_IPV4}
      # - WG_MTU=1420
      # - WG_ALLOWED_IPS=192.168.15.0/24, 10.0.1.0/24
      # - WG_PERSISTENT_KEEPALIVE=25
      # - WG_PRE_UP=echo "Pre Up" > /etc/wireguard/pre-up.txt
      # - WG_POST_UP=echo "Post Up" > /etc/wireguard/post-up.txt
      # - WG_PRE_DOWN=echo "Pre Down" > /etc/wireguard/pre-down.txt
      # - WG_POST_DOWN=echo "Post Down" > /etc/wireguard/post-down.txt
      # - UI_TRAFFIC_STATS=true
      # - UI_CHART_TYPE=0
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    init: true
    volumes:
      - ./wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      # - "51821:51821/tcp" # WebUI port
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      homelab:
        ipv4_address: 10.0.1.12

networks:
  homelab:
    external: true
